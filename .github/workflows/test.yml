name: test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["adamantite"]
    branches: [main]
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # A workflow_run event checks out the default branch by default. Check out the commit
          # that passed the previous workflow instead.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  # Vitest needs a newer Node.js version than the `engines.node` floor. Build with the default
  # Node.js version, then run the built package on the exact floor.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup minimum Node.js
        uses: actions/setup-node@v7
        with:
          # Keep equal to the `engines.node` floor in package.json.
          node-version: "20.0.0"

      - name: Run compatibility smoke test
        run: node scripts/compat-smoke.mjs dist
